name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flake:
    strategy:
      matrix:
        runners:
          # - runner: ubuntu-latest
          #   name: default
          #   platform: ARM64
          - runner: macos-latest
            name: dudumini
            arch: X64
          - runner: macos-latest
            name: dudupro
            arch: ARM64

    runs-on: ${{ matrix.runners.runner }}
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/flake-checker-action@v10
      - uses: DeterminateSystems/flakehub-cache-action@v2

      - run: nix flake check --show-trace

      - run: echo "building ${{ matrix.runners.name }}"
        if: matrix.runners.runner == 'macos-latest'

      - run: nix build .#darwinConfigurations.${{ matrix.runners.name }}.system
