name: Build

# push-only: this repo's real PR review happens on Forgejo (fast-ci.yml
# there already covers nix fmt/flake check on every push and PR). Only main
# ever needs the one thing Forgejo structurally can't do — an actual
# aarch64-darwin build — so a pull_request trigger here would just burn
# GitHub Actions minutes on checks Forgejo already ran, with no PR on GitHub
# to attach the result to anyway (nothing here opens GitHub-side PRs).
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # dudumini (x86_64-darwin) dropped from CI: nixpkgs-unstable no
          # longer supports the architecture as of the 26.11 cycle.
          - host: dudupro
            system: aarch64-darwin
            runner: macos-15

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # Builds flake.nix's checks.<system>.build-<host> instead of
      # darwinConfigurations.<host>.system directly: that check mirrors the
      # real host but with nix.linux-builder disabled, since this runner has
      # no way to build its aarch64-linux VM image and no guarantee
      # cache.nixos.org already has it substituted for the pinned nixpkgs rev.
      - run: nix build .#checks.${{ matrix.system }}.build-${{ matrix.host }}

      # dotfiles' real development happens on Forgejo (this repo is only a
      # push-mirror target) — without this, the one check GitHub can run that
      # Forgejo structurally can't (an actual aarch64-darwin build, not just
      # an eval) never shows up where PRs are reviewed. Uses Forgejo's own
      # commit-status API, verified live to work and to appear combined with
      # fast-ci's native Forgejo Actions status on the same commit/PR.
      # continue-on-error: a broken status relay (e.g. FORGEJO_STATUS_TOKEN
      # not set up yet) must never make this job report the build itself as
      # failed.
      - name: report status to Forgejo
        if: always()
        continue-on-error: true
        run: |
          state="failure"
          if [ "${{ job.status }}" = "success" ]; then state="success"; fi
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.FORGEJO_STATUS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"context\":\"github/build-aarch64-darwin\",\"description\":\"aarch64-darwin build\",\"state\":\"$state\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://forgejo.emx.casa/api/v1/repos/emaiax/dotfiles/statuses/${{ github.sha }}"
