name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  flake:
    strategy:
      matrix:
        runners: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runners }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/magic-nix-cache-action@v9

      - name: Check flake
        run: nix flake check
