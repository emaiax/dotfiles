name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Arch-independent checks run once on Linux, where the Determinate
  # tooling ships binaries (flake-checker has no x86_64-darwin build).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: DeterminateSystems/flake-checker-action@v13

      - run: nix fmt -- --ci

      - run: nix flake check --show-trace

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # dudumini (x86_64-darwin) dropped from CI: nixpkgs-unstable no
          # longer supports the architecture as of the 26.11 cycle.
          - host: dudupro
            system: aarch64-darwin
            runner: macos-15

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: "read"
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      # Builds flake.nix's checks.<system>.build-<host> instead of
      # darwinConfigurations.<host>.system directly: that check mirrors the
      # real host but with nix.linux-builder disabled, since this runner has
      # no way to build its aarch64-linux VM image and no guarantee
      # cache.nixos.org already has it substituted for the pinned nixpkgs rev.
      - run: nix build .#checks.${{ matrix.system }}.build-${{ matrix.host }}

      # The status relay used to live here as a step that curl'd Forgejo's
      # commit-status API directly. Doesn't work: forgejo.emx.casa is
      # LAN-only, and this runner is on the public internet with no path to
      # it — every attempt timed out (curl exit 28), silently swallowed by
      # continue-on-error. Relay now runs from the other direction instead:
      # .forgejo/workflows/gh-build-status.yml, on a self-hosted runner that
      # has both outbound internet (to poll this run via GitHub's public API)
      # and LAN access to Forgejo's own API.
