# GitHub's macos-15 runner can't reach this instance to report its own
# build.yml result back (forgejo.emx.casa is LAN-only, not internet-exposed),
# so this runs the relay from the other side instead: a self-hosted runner
# here has outbound internet *and* local access to this instance's own API,
# so it polls GitHub's (public) Actions API for the matching run and posts
# the result to this repo's commit status itself.
#
# GH_ACTIONS_READ_TOKEN: a fine-grained GitHub PAT (this repo only, Actions:
# Read-only) for the poll requests below — unauthenticated GitHub API reads
# are capped at 60 req/h *per IP*, shared with everything else on this
# network, and were observed exhausting that quota mid-poll. Terraform-managed
# in dudumox (forgejo-dotfiles-ci unit); see dudumox issue #505.
name: gh-build-status

# push-only, matching build.yml's own trigger (PR #112): that workflow only
# ever builds on a push to main, so a pull_request trigger here just burns a
# full poll timeout waiting for a GitHub run that will never exist (observed
# live — a PR push timed out after 17m for exactly this reason).
# workflow_dispatch: manual re-run, e.g. after a runner-infra hiccup killed a
# relay mid-poll (observed live: a Docker socket-proxy blip on this instance
# killed this job and an unrelated one in the same second).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gh-build-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    runs-on: docker
    # build.yml's own build job times out at 20m; this needs enough margin
    # above that for mirror-sync + queueing lag, not a separate budget.
    timeout-minutes: 25
    permissions:
      statuses: write
    container:
      image: ${{ vars.CI_IMAGE_REGISTRY }}/homelab/dudumox-ci:latest
    steps:
      - name: poll GitHub's build.yml run and relay its result here
        run: |
          set -euo pipefail

          sha="${{ github.sha }}"
          gh_repo="emaiax/dotfiles"
          poll_interval=20
          max_wait=1260 # 21m: build.yml's own 20m timeout, plus a little slack

          echo "polling GitHub for a build.yml run at $sha"

          status=""
          conclusion=""
          run_url=""
          elapsed=0
          while [ "$elapsed" -lt "$max_wait" ]; do
            raw="$(curl -s -w '\n%{http_code}' \
              -H "Authorization: Bearer ${{ secrets.GH_ACTIONS_READ_TOKEN }}" \
              "https://api.github.com/repos/$gh_repo/actions/workflows/build.yml/runs?head_sha=$sha&per_page=1")"
            http_code="${raw##*$'\n'}"
            body="${raw%$'\n'*}"

            if [ "$http_code" = "200" ]; then
              # node, not jq: guaranteed present in this image, jq isn't.
              fields="$(node -e '
                const d = JSON.parse(require("fs").readFileSync(0, "utf8"));
                const run = d.workflow_runs && d.workflow_runs[0];
                if (run) console.log([run.status, run.conclusion || "", run.html_url].join("|"));
              ' <<<"$body")"

              if [ -n "$fields" ]; then
                IFS='|' read -r status conclusion run_url <<<"$fields"
                [ "$status" = "completed" ] && break
              fi
            else
              # Distinct from "no matching run yet" (200, empty workflow_runs):
              # a non-200 here (rate limit, GitHub outage, etc.) was previously
              # silently swallowed and indistinguishable from "not found yet".
              echo "poll attempt got HTTP $http_code from GitHub, retrying in ${poll_interval}s: $(echo "$body" | head -c 200)"
            fi

            sleep "$poll_interval"
            elapsed=$((elapsed + poll_interval))
          done

          if [ "$status" != "completed" ]; then
            echo "::error::timed out waiting for GitHub's build.yml run to complete for $sha"
            exit 1
          fi

          state="failure"
          [ "$conclusion" = "success" ] && state="success"

          post_raw="$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"context\":\"github/build-aarch64-darwin\",\"description\":\"aarch64-darwin build\",\"state\":\"$state\",\"target_url\":\"$run_url\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/$sha")"
          post_code="${post_raw##*$'\n'}"
          post_body="${post_raw%$'\n'*}"

          if [ "$post_code" -lt 200 ] || [ "$post_code" -ge 300 ]; then
            echo "::error::posting status to this instance's own API failed with HTTP $post_code: $(echo "$post_body" | head -c 300)"
            exit 1
          fi
          echo "posted state=$state for $sha (HTTP $post_code)"
